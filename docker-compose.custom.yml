services:
  remnawave:
    image: ${CUSTOM_BACKEND_IMAGE:-ghcr.io/fourgetu/remnawave-backend:custom-v0.2.0}
    container_name: remnawave-custom
    hostname: remnawave
    restart: always
    env_file: .env
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    networks:
      - remnawave-custom-network
    volumes:
      - valkey-socket:/var/run/valkey
      - ${PANEL_CERTIFICATE_HOST_DIR:-./panel-certificate}:/var/lib/remnawave/panel-certificate:ro
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:3000
      - 127.0.0.1:${METRICS_PORT:-3001}:3001
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${METRICS_PORT:-3001}/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      remnawave-db:
        condition: service_healthy
      remnawave-redis:
        condition: service_healthy

  remnawave-db:
    image: postgres:18.4
    container_name: remnawave-custom-db
    hostname: remnawave-db
    restart: always
    shm_size: 512mb
    env_file: .env
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    networks:
      - remnawave-custom-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: UTC
    ports:
      - 127.0.0.1:6767:5432
    volumes:
      - remnawave-custom-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  remnawave-redis:
    image: valkey/valkey:9-alpine
    container_name: remnawave-custom-redis
    hostname: remnawave-redis
    restart: always
    networks:
      - remnawave-custom-network
    volumes:
      - valkey-socket:/var/run/valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    healthcheck:
      test: ['CMD', 'valkey-cli', '-s', '/var/run/valkey/valkey.sock', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

networks:
  remnawave-custom-network:
    name: remnawave-custom-network
    driver: bridge

volumes:
  remnawave-custom-db-data:
    name: remnawave-custom-db-data
  valkey-socket:
    name: remnawave-custom-valkey-socket
